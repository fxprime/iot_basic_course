site_name: IoT Basic Course Documentation
site_url: https://tutoriaz.modulemore.com/docs/iot_basic_course/site/
site_description: >-
  เอกสารประกอบการเรียนหลักสูตร IoT Basic Course โดย Modulemore
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: deep orange
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: indigo
      accent: amber
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - md_in_html
  - attr_list
nav:
  - Home: index.md
  - ESP32 Course:
      - Overview: esp32/overview.md
      - 'Module 1: เริ่มต้นกับ ESP32':
          - 'บทที่ 1: ดาวน์โหลดและติดตั้ง Arduino IDE': esp32/01-download-ide.md
          - 'บทที่ 2: ติดตั้ง ESP32 Board': esp32/02-setup-esp32.md
          - 'บทที่ 3: โปรแกรมแรก': esp32/03-first-program.md
          - 'บทที่ 4: Serial Monitor - การสื่อสารสองทาง': esp32/04-serial-monitor.md
      - 'Module 2: Input/Output และโปรเจคประยุกต์':
          - 'บทที่ 5: Button และ Debouncing': esp32/05-button-debouncing.md
          - 'บทที่ 6: PWM และการควบคุมความสว่าง LED': esp32/06-pwm-led.md
          - 'บทที่ 7: Servo Motor และการควบคุมมุม': esp32/07-servo-motor.md
          - 'บทที่ 8: Ultrasonic Sensor และถังขยะอัตโนมัติ': esp32/08-ultrasonic-sensor.md
          - 'บทที่ 9: Analog Input และตู้ให้อาหารปลา': esp32/09-analog-input.md
          - '🎯 บทที่ 10: โปรเจคประตูโรงจอดรถอัตโนมัติ': esp32/10-parking-gate-project.md
          - 'บทที่ 11: LCD Display และการแสดงผล': esp32/11-lcd-display.md
          - 'บทที่ 12: Relay Module และโปรเจครวม': esp32/12-relay-module.md
          - 'บทที่ 13: WiFi และ NTP Time': esp32/13-wifi-ntp.md
          - 'บทที่ 14: Google Sheets Integration': esp32/14-google-sheets.md
      - 'Archive (เนื้อหาเก่า)':
          - 'Module 3: การเขียนโค้ดขั้นสูง': esp32/archive/08-define-const.md
      - Appendix:
          - Pinout Reference: esp32/appendix/pinout-reference.md
          - Troubleshooting Checklist: esp32/appendix/troubleshooting.md
  - Shared Resources:
      - Getting Started: shared/getting-started.md
      - Classroom Etiquette: shared/classroom-etiquette.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fxprime/tutoriaz
      name: Tutoriaz on GitHub
